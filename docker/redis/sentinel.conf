# Redis Sentinel configuration
# Monitors redis-primary and triggers failover if it becomes unreachable.
# Two sentinels (this file used for a single-sentinel demo; production
# requires ≥ 3 sentinels on separate physical/virtual hosts).

sentinel monitor trading-redis redis-primary 6379 1

# Sentinel considers the master down after this many milliseconds
sentinel down-after-milliseconds trading-redis 5000

# Wait this long before starting failover
sentinel failover-timeout trading-redis 30000

# Number of replicas to reconfigure in parallel during failover
sentinel parallel-syncs trading-redis 1

# Optional: notify scripts (leave empty for demo)
# sentinel notification-script trading-redis /scripts/notify.sh
