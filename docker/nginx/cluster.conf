# nginx cluster load balancer configuration
#
# Strategy: least_conn (fewest active connections)
# This pairs well with ClusterModule's internal task routing — nginx handles
# HTTP-level load balancing while the cluster distributes background tasks.
#
# For sticky WebSocket sessions, use ip_hash instead of least_conn.
# For REST-only workloads, least_conn is optimal.

events {
    worker_processes auto;
    worker_connections 4096;
}

http {
    upstream api_cluster {
        least_conn;

        # Docker Compose service discovery: 'api' resolves to all replica IPs
        # via Docker's built-in DNS round-robin. Nginx will re-resolve on each
        # connection when resolver is set.
        server api:3000;

        keepalive 32;
    }

    # Health check endpoint passthrough — not load balanced
    upstream api_health {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts tuned for trading platform (long-running analytics requests)
        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # HTTP keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ── API routes ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_cluster;
        }

        # ── Health / readiness ───────────────────────────────────────────────
        # Always route to the same upstream to avoid the health check
        # triggering work on a different node than the one being probed.
        location ~ ^/(api/v1/health|api/v1/live|api/v1/ready) {
            proxy_pass http://api_cluster;
        }

        # ── Cluster metrics (diagnostics) ────────────────────────────────────
        location /api/v1/diagnostics/ {
            proxy_pass http://api_cluster;
        }
    }
}
