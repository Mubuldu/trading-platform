# =============================================================================
# DEVELOPMENT COMPOSE
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# Features:
#  - Source code hot-reload via volume mount
#  - Debug port 9229 exposed for VS Code attach
#  - Swagger UI enabled
#  - Verbose logging
# =============================================================================

version: '3.9'

networks:
  trading-net:
    driver: bridge
    name: trading-platform-network

volumes:
  logs-data:
    name: trading-platform-logs-dev
  redis-data:
    name: trading-platform-redis-dev
  postgres-data:
    name: trading-platform-postgres-dev
  ml-models:
    name: trading-platform-ml-models-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-platform-postgres-dev
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trading -d trading_platform']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c log_min_duration_statement=1000
      -c log_connections=off
      -c log_disconnections=off

  redis:
    image: redis:7-alpine
    container_name: trading-platform-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - trading-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: trading-platform-ml-dev
    restart: unless-stopped
    ports:
      - '8001:8001'
    volumes:
      # Persist the trained model artifact across container restarts.
      # Run train.py locally and copy the output here, then POST /reload.
      - ml-models:/app/models
    environment:
      ML_MODEL_PATH: /app/models/signal_classifier.json
      # Threshold sweep on 653-sample held-out test:
      #   0.45 → 25.7% win rate (1.07x lift, 606 passes — too permissive)
      #   0.50 → 39.3% win rate (1.64x lift, 183 passes)
      #   0.55 → 70.0% win rate (2.91x lift,  30 passes) ← active
      # Raise to 0.60 for even higher conviction; lower to 0.50 for more volume.
      ENTER_THRESHOLD: '0.55'
    networks:
      - trading-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: trading-platform-api-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '9229:9229'
    environment:
      NODE_ENV: development
      APP_NAME: trading-platform
      APP_PORT: '3000'
      APP_VERSION: '1.0.0'
      LOG_LEVEL: debug
      LOG_DIR: /app/logs
      SWAGGER_ENABLED: 'true'
      CORS_ORIGINS: 'http://localhost:3000'
      API_KEY_SECRET: 'dev-secret-key-not-for-production-use-only'
      REDIS_URL: 'redis://redis:6379'
      REDIS_PASSWORD: ''
      REDIS_KEY_PREFIX: 'tp:'
      REDIS_STREAM_MAXLEN: '100000'
      # ML signal sidecar — leave empty to disable (pass-through fallback)
      ML_SERVICE_URL: 'http://ml-service:8001'
      # Symbols to register indicators + run strategies for.
      # Must match the strategy's enabledSymbols in trend-following-v1.strategy.ts.
      INDICATOR_DEFAULT_SYMBOLS: 'BTC/USDT,ETH/USDT,SOL/USDT'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: trading_platform
      DB_USER: trading
      DB_PASSWORD: trading_dev_password
      DB_SSL: 'false'
      DB_POOL_MIN: '2'
      DB_POOL_MAX: '10'
      DB_MIGRATE_ON_STARTUP: 'true'
    volumes:
      - ./src:/app/src:ro
      - ./sdk:/app/sdk:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
      - logs-data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
